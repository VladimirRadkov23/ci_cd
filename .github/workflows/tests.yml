name: Reusable Workflow
on:
  workflow_call:     # запускается другим workflow

jobs:
  console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
     
      - name: Install requirements
        run: pip install -r requirements.txt

      #- name: Run Pytest
      #  run: pytest
        
      #- name: Run mypy
      #  run: |
      #    mypy main/
      #    mypy tests/

      - name:
        run: |
          flake8 main/
          flake8 tests/
