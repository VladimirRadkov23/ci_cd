# caches работа с кэшем
name: Fourteenth Workflow
on: workflow_dispatch

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # копируем репозиторий
      - name: Cache node_modules # кэщируем
        id: cache-step # задаём id чтобы потом могли бы вывести кэш
        uses: actions/cache@v3
        with: # передаём путь где хранится кэш
          path: ~/.npm
          #key: "cache-file"   # имя файла / статический ключ по которому будет искаться этот кэш
          key: ${{ runner.os }}-cache-file-${{ hashFiles('**/package-lock.json') }} # лучше генерировать динамический ключ
          restore-keys: | # будет искаться если другой не найдётся
            ${{ runner.os }}-cache-file-
            ${{ runner.os }}-

      - name: Display Cache # отображаем нужно кэш по его id
        run: echo '${{ tojson(steps.cache-step.outputs) }}'

      - name: Install node_modules # устанавливаем зависимости
        run: npm install
